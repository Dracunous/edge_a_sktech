<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge_A_Sketch</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>

    <main>
        <div class="left">

            <h1>Edge_A_Sketch</h1>
            <input id="color-changer"  type="color">

            <button class="button color-mode">Colour mode</button>
            <button class="button eraser">Eraser</button>
            <button class="button clear">Clear</button>
            <div class="range-input">
                <input type="range" min="1" max="64" value="20" id="range" step="1">
                <p class="para"></p>
            </div>

        </div>
        
        <div class="container"></div>




       
    </main>
    
</body>
</html>
